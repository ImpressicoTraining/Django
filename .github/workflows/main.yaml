
name: Main Workflow

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:

  # --------------------------------------------------
  # 1. Validate PR commit message
  # --------------------------------------------------

  allow-to-merge:
    name: Allow To Merge
    if: github.event_name == 'pull_request'
    uses: ImpressicoTraining/common-workflows/.github/workflows/allow-to-merge.yaml@main
    permissions:
      contents: read
      pull-requests: read

  # --------------------------------------------------
  # 2. CodeQL analysis
  # --------------------------------------------------

  codeql-analysis:
    name: CodeQL Analysis
    uses: ImpressicoTraining/common-workflows/.github/workflows/codeql-analysis.yaml@main
    secrets: inherit
    with:
      language: python
    permissions:
      contents: read
      security-events: write
      actions: read

  # --------------------------------------------------
  # 3. Unit tests
  # --------------------------------------------------

  unit-tests:
    name: Unit Tests and Coverage
    uses: ImpressicoTraining/common-workflows/.github/workflows/unit-tests.yaml@main
    with:
      application: Django
      setup_command: |
        python -m pip install --upgrade pip
        python -m pip install uv
        uv sync --no-default-groups --group test
      test_command: |
        uv run --locked --no-default-groups --group test --with pytest-cov pytest --cov --cov-branch --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml:coverage.xml --cov-report=markdown-append:$GITHUB_STEP_SUMMARY --cov-fail-under=75
    permissions:
      contents: read

  # --------------------------------------------------
  # 4. Generate DEV version
  # --------------------------------------------------

  generate-dev-version:
    name: Generate DEV Version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ImpressicoTraining/common-workflows/.github/workflows/generate-version.yaml@main
    with:
      minor: "0"
      patch: "0"
    permissions:
      contents: write

  # --------------------------------------------------
  # 5. Docker build and security scan
  # --------------------------------------------------

  docker-build:
    name: Docker Build and Security Scan
    needs:
      - generate-dev-version
    if: |
      always() &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.generate-dev-version.result == 'success'
        )
      )
    uses: ImpressicoTraining/common-workflows/.github/workflows/docker-build.yaml@main
    with:
      application: django
      image_name: impressicotraining/django
      image_tag: ${{ github.event_name == 'push' && needs.generate-dev-version.outputs.version || format('ci-{0}-{1}', github.run_number, github.sha) }}
      upload_image_artifact: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      artifact_name: django-image
    permissions:
      contents: read

  # --------------------------------------------------
  # 6. Create and push version tag
  # --------------------------------------------------

  create-version-tag:
    name: Create and Push Version Tag

    needs:
      - codeql-analysis
      - unit-tests
      - generate-dev-version
      - docker-build

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.codeql-analysis.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      needs.generate-dev-version.result == 'success' &&
      needs.docker-build.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.TAG_PUSH_TOKEN }}

      - name: Create and push version tag
        shell: bash
        env:
          VERSION: ${{ needs.generate-dev-version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "$VERSION" ]]; then
            echo "ERROR: Generated version is empty."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "ERROR: Tag already exists: $VERSION"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$VERSION" "$GITHUB_SHA" \
            -m "Release version $VERSION"

          git push origin "refs/tags/$VERSION"

          echo "Successfully created tag: $VERSION"

      - name: Version tag summary
        shell: bash
        env:
          VERSION: ${{ needs.generate-dev-version.outputs.version }}
        run: |
          {
            echo "## Version Tag Created"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | $VERSION |"
            echo "| Commit | $GITHUB_SHA |"
            echo "| Branch | main |"
          } >> "$GITHUB_STEP_SUMMARY"
