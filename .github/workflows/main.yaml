name: Main workflow

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  allow-to-merge:
    name: Allow To Merge
    if: github.event_name == 'pull_request'
    uses: ImpressicoTraining/common-workflows/.github/workflows/allow-to-merge.yaml@main
    permissions:
      contents: read
      pull-requests: read
 
  codeql-analysis:
    name: CodeQL Python Analysis
    uses: ImpressicoTraining/common-workflows/.github/workflows/codeql-analysis.yaml@main
    with:
      language: python
    permissions:
      contents: read
      security-events: write
      actions: read
  

  django-unit-tests:
    name: Django Unit Tests and Coverage
    uses: ImpressicoTraining/common-workflows/.github/workflows/unit-tests.yaml@main
    with:
      application: Django

      setup_command: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install coverage

      test_command: |
        python -m coverage run --rcfile=.coveragerc manage.py test
        python -m coverage report --rcfile=.coveragerc --fail-under=75

    permissions:
      contents: read


