
name: Publish Workflow

on:
  workflow_dispatch:
    inputs:
      main_run_id:
        description: Main workflow run ID containing the build artifacts
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:

  # --------------------------------------------------
  # 1. Download and validate build metadata
  # --------------------------------------------------

  get-build-metadata:
    name: Get Build Metadata
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Validate Main workflow run ID
        shell: bash
        env:
          MAIN_RUN_ID: ${{ inputs.main_run_id }}
        run: |
          set -euo pipefail

          if [[ ! "$MAIN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid Main workflow run ID."
            exit 1
          fi

          echo "Main workflow run ID: $MAIN_RUN_ID"

      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          name: django-build-metadata
          path: build-metadata
          run-id: ${{ inputs.main_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated version and commit
        id: version
        shell: bash
        env:
          TAG_VERSION: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          VERSION_FILE="build-metadata/version.txt"

          if [[ ! -f "$VERSION_FILE" ]]; then
            echo "ERROR: Build metadata file not found."
            exit 1
          fi

          VERSION="$(sed -n 's/^version=//p' "$VERSION_FILE")"
          COMMIT_SHA="$(sed -n 's/^commit_sha=//p' "$VERSION_FILE")"

          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "ERROR: Tag version does not match build metadata."
            echo "Tag: $TAG_VERSION"
            echo "Metadata: $VERSION"
            exit 1
          fi

          if [[ "$COMMIT_SHA" != "$SOURCE_SHA" ]]; then
            echo "ERROR: Commit SHA does not match build metadata."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+-DEV\.[0-9]+$ ]]; then
            echo "ERROR: Invalid DEV version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Version validated: $VERSION"
          echo "Source commit: $SOURCE_SHA"

      - name: Display build metadata
        shell: bash
        run: |
          echo "Build metadata:"
          cat build-metadata/version.txt

  # --------------------------------------------------
  # 2. Publish Docker image and Helm chart
  # --------------------------------------------------

  publish:
    name: Publish Image and Helm Chart

    needs:
      - get-build-metadata

    uses: ImpressicoTraining/common-workflows/.github/workflows/publish_images_and_charts.yaml@main

    with:
      artifact_run_id: ${{ inputs.main_run_id }}
      artifact_name: django-image
      source_sha: ${{ github.sha }}
      version: ${{ needs.get-build-metadata.outputs.version }}
      local_image_name: impressicotraining/django
      ghcr_image: ghcr.io/impressicotraining/django
      chart_path: kubernetes

    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write

    secrets: inherit
